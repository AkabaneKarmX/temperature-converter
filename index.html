<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Convert temperatures between Celsius, Fahrenheit and Kelvin.">
  <link rel="stylesheet" href="Stylesheets/style.css">
  <title>Temperature Converter</title>
</head>

<body>
  <div class="temperature-converter">
    <h1>Temperature Converter</h1>

    <div class="temperature-inputs">
      <label for="temperatureValue">Enter a temperature (Celsius, Kelvin or Fahrenheit):</label>
      <input type="text" id="temperatureValue" inputmode="decimal">
    </div>

    <div class="temperature-units">
      <label for="celsiusToKelvin"><input type="radio" name="tempUnit" id="celsiusToKelvin" checked>Celsius to Kelvin</label>
      <label for="celsiusToFahrenheit"><input type="radio" name="tempUnit" id="celsiusToFahrenheit">Celsius to Fahrenheit</label>
      <label for="kelvinToFahrenheit"><input type="radio" name="tempUnit" id="kelvinToFahrenheit">Kelvin to Fahrenheit</label>
      <label for="fahrenheitToKelvin"><input type="radio" name="tempUnit" id="fahrenheitToKelvin">Fahrenheit to Kelvin</label>
    </div>

    <div class="buttons-and-outputs">
      <button id="submitButton">Submit</button>
      <button id="resetButton">Reset</button>
      <p>Answer: <span id="tempValue" aria-live="polite"></span></p>
    </div>
  </div>

  <script src="Scripts/index.js"></script>
</body>
</html>
